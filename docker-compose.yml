services:

  # ── PostgreSQL (required — ingestion job tracking) ─────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: caseflow-ai-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: caseflow_ai
      POSTGRES_USER: caseflow_ai
      POSTGRES_PASSWORD: caseflow_ai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caseflow_ai -d caseflow_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── LLM runtime: llama.cpp llama-server (OpenAI-compatible API) ────────────
  # GGUF files live in ./models (git-ignored). Download them first — see README
  # ("Models"). Chat and embeddings run as two processes because llama-server
  # serves one model per process. Requires an NVIDIA GPU; for CPU-only use the
  # ghcr.io/ggml-org/llama.cpp:server image and drop the `deploy` blocks.
  llama-chat:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-chat
    ports:
      - "8090:8080"
    volumes:
      - ./models:/models:ro
    # 2 parallel slots x 8k context; q8_0 KV cache keeps a 4B model + cache inside ~6 GB VRAM.
    # -ngl auto offloads as many layers as fit and runs the rest on CPU (larger models, smaller GPUs).
    # CHAT_EXTRA_ARGS e.g. "--reasoning-budget 0" for models with a thinking mode.
    command: >-
      -m /models/${CHAT_MODEL_FILE:-Qwen3-4B-Instruct-2507-Q4_K_M.gguf}
      --alias ${AI_CHAT_MODEL:-qwen3-4b-instruct}
      --host 0.0.0.0 --port 8080
      -ngl auto -c 16384 -np 2 -fa on
      --cache-type-k q8_0 --cache-type-v q8_0
      --jinja ${CHAT_EXTRA_ARGS:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  llama-embed:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-embed
    ports:
      - "8091:8080"
    volumes:
      - ./models:/models:ro
    command: >-
      -m /models/${EMBED_MODEL_FILE:-bge-m3-Q8_0.gguf}
      --alias ${AI_EMBED_MODEL:-bge-m3}
      --host 0.0.0.0 --port 8080
      --embeddings -ngl auto -c 8192 -ub 8192
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # ── Qdrant (Vector Store) ──────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # The qdrant image ships without curl/wget; a TCP check via bash is enough
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Ollama (optional fallback runtime — profile: ollama) ──────────────────
  # Start with: docker compose --profile ollama up, and run the service with
  # SPRING_PROFILES_ACTIVE=ollama (see application-ollama.yml).
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    profiles:
      - ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama-init:
    image: ollama/ollama:latest
    profiles:
      - ollama
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama pull llama3.1 &&
       ollama pull nomic-embed-text"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    restart: "no"

  # ── Kafka + Zookeeper (optional async ingest — profile: async) ─────────────
  # Start with: docker compose --profile async up
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    container_name: zookeeper
    profiles:
      - async
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: kafka
    profiles:
      - async
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── caseflow-ai-service ────────────────────────────────────────────────────
  caseflow-ai-service:
    build: .
    container_name: caseflow-ai-service
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      llama-chat:
        condition: service_healthy
      llama-embed:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      - SERVER_PORT=8081
      - AI_CHAT_BASE_URL=http://llama-chat:8080
      - AI_EMBED_BASE_URL=http://llama-embed:8080
      - AI_CHAT_MODEL=${AI_CHAT_MODEL:-qwen3-4b-instruct}
      - AI_EMBED_MODEL=${AI_EMBED_MODEL:-bge-m3}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6334
      - QDRANT_HTTP_PORT=6333
      - QDRANT_COLLECTION_DOCUMENTS=caseflow-documents
      - DB_URL=jdbc:postgresql://postgres:5432/caseflow_ai
      - DB_USERNAME=caseflow_ai
      - DB_PASSWORD=caseflow_ai
      # Set ASYNC_ENABLED=true and KAFKA_BOOTSTRAP_SERVERS to activate consumers
      - ASYNC_ENABLED=false
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    restart: unless-stopped

volumes:
  postgres-data:
  ollama-data:
  qdrant-data:
