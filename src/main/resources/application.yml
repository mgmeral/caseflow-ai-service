server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: caseflow-ai-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}

  # ── Relational DB (required for ingestion job tracking) ──────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/caseflow_ai}
    username: ${DB_USERNAME:caseflow_ai}
    password: ${DB_PASSWORD:caseflow_ai}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        default_schema: public

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

  # ── Spring AI: OpenAI-compatible LLM + embeddings ─────────────────────────
  # Any server speaking the OpenAI API works: llama.cpp llama-server (default, see
  # docker-compose.yml), vLLM, Ollama's /v1 (profile "ollama"), or a hosted provider.
  # Chat and embeddings are separate URLs because llama-server serves one model per process.
  # Never point these at a hosted provider with real ticket data without a KVKK/GDPR decision (AI-001).
  ai:
    # Spring AI's default retry (10 attempts, exponential backoff up to minutes) held every request
    # for minutes when the LLM server was down, past caseflow-be's read timeout. Fail fast instead:
    # caseflow-be has its own retry + circuit breaker, and ingestion retries via its job queue.
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 500ms
        multiplier: 2
        max-interval: 2s
    model:
      chat: openai
      embedding: openai
    openai:
      # Local servers ignore the key; hosted providers need a real one.
      api-key: ${AI_API_KEY:not-needed}
      chat:
        base-url: ${AI_CHAT_BASE_URL:http://localhost:8090}
        options:
          model: ${AI_CHAT_MODEL:qwen3-4b-instruct}
          temperature: 0.2
          max-tokens: ${AI_CHAT_MAX_TOKENS:1024}
          # Every prompt in this service asks for a JSON object; enforce it at the decoder.
          response-format:
            type: JSON_OBJECT
      embedding:
        base-url: ${AI_EMBED_BASE_URL:http://localhost:8091}
        options:
          model: ${AI_EMBED_MODEL:bge-m3}
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        # gRPC port used by Spring AI VectorStore for vector operations
        port: ${QDRANT_PORT:6334}
        collection-name: ${QDRANT_COLLECTION_DOCUMENTS:caseflow-documents}
        use-tls: false
        # Do not attempt to create the collection at startup — manage lifecycle externally
        initialize-schema: false

  # ── Kafka (optional — controlled by caseflow.ai.async.enabled) ───────────
  # The service boots and serves sync endpoints even if Kafka is absent.
  # Set KAFKA_BOOTSTRAP_SERVERS and caseflow.ai.async.enabled=true to activate consumers.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: caseflow-ai-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.caseflow.ai.messaging.event"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.caseflow.ai.messaging.event.GenericKafkaEvent
    admin:
      # Do not crash startup if Kafka broker is unavailable
      fail-fast: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# ── CaseFlow AI service configuration ────────────────────────────────────────
caseflow:
  ai:
    # Reported in response metadata; follows the chat model setting (also under the ollama profile)
    model-name: ${spring.ai.openai.chat.options.model}
    default-locale: en
    default-top-k: 5
    # Characters; chunks end on sentence boundaries (ChunkingService). bge-m3 handles long inputs well.
    chunk-size: 1200
    chunk-overlap: 200
    # HTTP REST port for Qdrant health checks (default 6333).
    # Distinct from spring.ai.vectorstore.qdrant.port which is the gRPC port (default 6334).
    qdrant-http-port: ${QDRANT_HTTP_PORT:6333}

    # Async ingest consumers — DISABLED by default.
    # Set async.enabled=true AND configure KAFKA_BOOTSTRAP_SERVERS to activate.
    async:
      enabled: ${ASYNC_ENABLED:false}
      topic:
        ticket-sync: ticket-ai-sync-requested
        policy-ingest: policy-ai-ingest-requested
        template-ingest: template-ai-ingest-requested

    # Prompt versions — increment when prompts change materially.
    prompt:
      summary-version: "1.1"
      reply-draft-version: "1.1"
      similar-cases-version: "1.0"
      policy-guidance-version: "1.0"

    # Retrieval quality settings
    retrieval:
      # Minimum similarity score to include a result (0.0–1.0).
      # Lower = more results but potentially less relevant.
      # Calibrated for bge-m3 (2026-09-27, benchmark/retrieval-set.json): correct matches scored
      # 0.566–0.771 (cross-lingual lowest), unrelated documents mostly < 0.55. 0.6 dropped a
      # correct cross-lingual match; 0.5 keeps all of them.
      similarity-threshold: 0.5

    # Internal service-to-service auth (disabled by default — enable when caseflow-be integrates).
    # When enabled, all /api/** requests must carry X-Internal-Api-Key header.
    auth:
      enabled: false
      internal-api-key: ${INTERNAL_API_KEY:}

logging:
  level:
    com.caseflow.ai: INFO
    org.springframework.ai: INFO
    org.flywaydb: INFO
